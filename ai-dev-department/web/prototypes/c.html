<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDD · Чат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e10; --side: #131315; --panel: #18181b; --panel-2: #1f1f23; --hover: #24242a;
  --line: #2a2a30; --line-2: #34343b; --text: #ececee; --muted: #9d9da6; --faint: #6b6b74;
  --accent: #e2835a; --accent-2: #f0a07c; --ok: #4ec98a; --bad: #f2706b; --warn: #e9b44c; --info: #7aa7ff;
  --add-bg: rgba(78, 201, 138, .10); --del-bg: rgba(242, 112, 107, .10);
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --r: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 268px 1fr auto; height: 100vh; }
/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; font-weight: 600; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: radial-gradient(circle at 30% 30%, var(--accent-2), var(--accent) 55%, #8a3d1f); display: block; }
.new { margin: 8px 12px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); }
.new:hover { background: var(--hover); }
.new kbd { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
.search { margin: 4px 12px 8px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; color: var(--faint); background: transparent; border: 1px solid transparent; }
.search input { background: none; border: 0; outline: none; width: 100%; color: var(--text); }
.chats { overflow: auto; flex: 1; padding: 0 8px 8px; }
.group { font-size: 11.5px; color: var(--faint); padding: 14px 10px 4px; font-weight: 500; letter-spacing: .02em; }
.chat { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 14px; }
.chat span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.chat:hover { background: var(--hover); color: var(--text); }
.chat.on { background: var(--panel-2); color: var(--text); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.run { background: var(--accent); box-shadow: 0 0 0 3px rgba(226, 131, 90, .18); animation: pulse 1.4s infinite; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(226, 131, 90, 0); } }
.side-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: none; border: 1px solid transparent; color: var(--muted); }
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn svg { width: 17px; height: 17px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: #3a2f6b; display: grid; place-items: center; font-size: 13px; font-weight: 600; margin-left: auto; }
/* main */
main { display: flex; flex-direction: column; min-width: 0; height: 100vh; position: relative; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.top h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.chip.run { color: var(--accent-2); border-color: rgba(226, 131, 90, .35); }
.chip.done { color: var(--ok); border-color: rgba(78, 201, 138, .35); }
.spacer { flex: 1; }
.menu-btn { display: none; }
.scroll { flex: 1; overflow: auto; scroll-behavior: smooth; }
.thread { max-width: 780px; margin: 0 auto; padding: 28px 24px 200px; }
.empty { max-width: 680px; margin: 14vh auto 0; text-align: center; padding: 0 24px; }
.empty h2 { font-size: 30px; font-weight: 500; letter-spacing: -.01em; margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0 0 24px; }
.sugg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.sugg button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
.sugg button:hover { border-color: var(--line-2); color: var(--text); }
.sugg b { display: block; color: var(--text); font-weight: 500; margin-bottom: 2px; }
.msg-user { display: flex; justify-content: flex-end; margin: 8px 0 22px; }
.msg-user div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; }
.turn { margin-bottom: 26px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.who i { width: 20px; height: 20px; border-radius: 6px; background: radial-gradient(circle at 30% 30%, var(--accent-2), var(--accent) 60%, #8a3d1f); display: block; }
.text p { margin: 6px 0 10px; }
.text code { font: 13px var(--mono); background: var(--panel-2); padding: 1px 6px; border-radius: 5px; }
.thinking { color: var(--faint); font-size: 14px; display: inline-flex; gap: 8px; align-items: center; background: linear-gradient(90deg, var(--faint) 0%, var(--text) 50%, var(--faint) 100%) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
/* tool rows */
.tool { border-radius: 8px; margin: 2px 0; }
.tool-h { display: flex; align-items: center; gap: 8px; padding: 4px 8px; margin-left: -8px; border-radius: 7px; font-size: 13.5px; color: var(--muted); cursor: pointer; user-select: none; }
.tool-h:hover { background: var(--panel); color: var(--text); }
.tool-h .ic { width: 16px; text-align: center; color: var(--faint); font-family: var(--mono); font-size: 12px; }
.tool-h .nm { color: var(--text); font-weight: 500; }
.tool-h .arg { font: 12.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tool-h .st { margin-left: auto; font: 12px var(--mono); white-space: nowrap; }
.add { color: var(--ok); } .del { color: var(--bad); }
.spin { width: 12px; height: 12px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.tool-b { display: none; margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #121214; }
.tool.open .tool-b { display: block; }
.code { font: 12.5px/1.55 var(--mono); padding: 8px 0; overflow-x: auto; }
.code div { padding: 0 14px; white-space: pre; }
.code .a { background: var(--add-bg); color: #b9f0cf; }
.code .d { background: var(--del-bg); color: #f8c3c0; }
.code .n { color: var(--faint); display: inline-block; width: 34px; user-select: none; }
.term { font: 12.5px/1.55 var(--mono); padding: 10px 14px; color: #c9c9d1; white-space: pre-wrap; }
.term .cmd { color: var(--accent-2); }
.bhead { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--faint); padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
/* todo card */
.todo { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 10px 14px; margin: 10px 0 12px; }
.todo .h { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.todo li { list-style: none; display: flex; gap: 10px; align-items: center; font-size: 14px; padding: 2px 0; }
.todo ul { margin: 0; padding: 0; }
.box { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 10px; flex: none; }
.todo li.done { color: var(--faint); text-decoration: line-through; } .todo li.done .box { background: var(--ok); border-color: var(--ok); color: #0e0e10; }
.todo li.now .box { border-color: var(--accent); } .todo li.now { color: var(--text); }
/* sub-agents */
.agent { border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; background: linear-gradient(180deg, var(--panel), transparent 140px); }
.agent-h { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; }
.agent-h .g { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.agent-h b { font-weight: 600; font-size: 14px; }
.agent-h .d { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.agent-h .m { margin-left: auto; font: 11.5px var(--mono); color: var(--faint); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.agent-b { padding: 0 12px 8px 46px; }
.agent.closed .agent-b { display: none; }
.agent .sum { color: var(--muted); font-size: 13.5px; padding: 0 12px 10px 46px; display: none; }
.agent.closed .sum { display: block; }
.par { font-size: 12px; color: var(--faint); margin: 12px 0 0; display: flex; align-items: center; gap: 8px; }
.par::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.notice { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--faint); margin: 6px 0; padding: 4px 10px; border-left: 2px solid var(--warn); background: rgba(233, 180, 76, .05); border-radius: 0 6px 6px 0; }
/* result card */
.result { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 12px 0; }
.result .h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); font-size: 14px; }
.result .f { display: flex; gap: 10px; padding: 6px 14px; font: 12.5px var(--mono); border-top: 1px solid var(--line); color: var(--muted); cursor: pointer; }
.result .f:hover { background: var(--panel); color: var(--text); }
.result .f span:first-child { flex: 1; }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 6px 12px; font-size: 13px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--text); color: #111; border-color: var(--text); font-weight: 600; }
/* composer */
.composer-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 18px; background: linear-gradient(180deg, transparent, var(--bg) 30%); }
.composer { max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; padding: 10px 10px 8px 14px; box-shadow: 0 12px 40px -18px #000; }
.composer:focus-within { border-color: #4a4a52; }
.composer textarea { width: 100%; background: none; border: 0; outline: none; resize: none; min-height: 26px; max-height: 220px; font-size: 15px; line-height: 1.5; }
.composer .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.sel { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--muted); padding: 5px 9px; border-radius: 8px; background: none; border: 1px solid transparent; }
.sel:hover { background: var(--hover); color: var(--text); }
.sel .k { font: 11px var(--mono); color: var(--faint); }
.send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--text); color: #111; display: grid; place-items: center; }
.send:disabled { background: var(--line-2); color: var(--faint); }
.send.stop { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-2); }
.hint { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 8px; }
.popover { position: absolute; bottom: 100%; margin-bottom: 8px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; min-width: 260px; box-shadow: 0 16px 40px -12px #000; display: none; z-index: 5; }
.popover.on { display: block; }
.popover .it { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.popover .it:hover { background: var(--hover); }
.popover .it small { display: block; color: var(--faint); font-size: 12px; }
.popover .it.on::after { content: "✓"; float: right; color: var(--accent); }
/* right panel: changes */
.changes { width: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--side); transition: width .2s; display: flex; flex-direction: column; height: 100vh; }
.changes.on { width: min(560px, 46vw); }
.changes .top { justify-content: space-between; }
.ch-body { display: grid; grid-template-columns: 200px 1fr; flex: 1; min-height: 0; }
.tree { border-right: 1px solid var(--line); overflow: auto; padding: 8px; font: 12.5px var(--mono); }
.tree div { padding: 4px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; color: var(--muted); }
.tree div:hover, .tree div.on { background: var(--hover); color: var(--text); }
.tree div span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diffview { overflow: auto; }
/* settings */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: center; justify-content: center; z-index: 30; padding: 24px; }
.overlay.on { display: flex; }
.settings { width: min(980px, 100%); height: min(680px, 100%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; display: grid; grid-template-columns: 220px 1fr; overflow: hidden; box-shadow: 0 30px 80px -20px #000; }
.set-nav { background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.set-nav h3 { font-size: 13px; color: var(--faint); margin: 4px 10px 10px; font-weight: 500; }
.set-nav button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-size: 14px; display: flex; gap: 9px; align-items: center; }
.set-nav button.on, .set-nav button:hover { background: var(--hover); color: var(--text); }
.set-main { overflow: auto; padding: 22px 28px; position: relative; }
.set-main h2 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
.set-main .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.set-close { position: absolute; top: 14px; right: 14px; }
.rowx { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rowx .l b { font-weight: 500; display: block; }
.rowx .l span { color: var(--muted); font-size: 13px; }
.pill { font: 11.5px var(--mono); padding: 2px 9px; border-radius: 999px; border: 1px solid; justify-self: end; white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: rgba(78, 201, 138, .35); } .pill.warn { color: var(--warn); border-color: rgba(233, 180, 76, .35); } .pill.bad { color: var(--bad); border-color: rgba(242, 112, 107, .35); }
.kv { display: grid; grid-template-columns: 140px 1fr 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv .mono { font: 12.5px var(--mono); color: var(--muted); }
.inp { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; width: 100%; }
.mtabs { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 290px; z-index: 20; transform: translateX(-100%); transition: transform .2s; }
  .side.on { transform: none; box-shadow: 20px 0 60px #000a; }
  .menu-btn { display: inline-flex; }
  .thread { padding: 18px 16px 200px; }
  .composer-wrap { padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  .empty { margin-top: 8vh; padding: 0 16px; } .empty h2 { font-size: 24px; }
  .sugg { grid-template-columns: 1fr; }
  .changes.on { position: fixed; inset: 0; width: 100%; z-index: 25; }
  .ch-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .tree { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
  .settings { grid-template-columns: 1fr; height: 100%; } .set-nav { flex-direction: row; overflow-x: auto; padding: 8px; } .set-nav h3 { display: none; }
  .set-nav button { white-space: nowrap; } .overlay { padding: 0; } .settings { border-radius: 0; }
  .kv { display: flex; align-items: center; gap: 10px; } .kv > :first-child { flex: 1; min-width: 0; }
  .kv .mono { min-width: 0; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hide-sm { display: none !important; }
  .hint { display: none; }
  .composer .row { gap: 2px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i></i>AIDD</div>
    <button class="new" onclick="newChat()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Новый чат<kbd>Ctrl N</kbd></button>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Поиск по чатам"></label>
    <div class="chats" id="chats"></div>
    <div class="side-foot">
      <button class="ibtn" onclick="openSettings('keys')" title="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
      <div class="avatar">А</div>
    </div>
  </aside>

  <main>
    <div class="top">
      <button class="ibtn menu-btn" onclick="side.classList.toggle('on')" aria-label="Чаты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="title">Новый чат</h1>
      <span class="chip" id="status" hidden></span>
      <span class="spacer"></span>
      <button class="ibtn" id="chBtn" onclick="toggleChanges()" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18" opacity=".0"/><path d="M8 7h8M8 12h8M8 17h5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg><span class="hide-sm">Изменения</span> <span class="add" id="chAdd"></span> <span class="del" id="chDel"></span></button>
    </div>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="composer-wrap">
      <div class="composer" style="position:relative">
        <div class="popover" id="pop-mode" style="left:40px"></div>
        <div class="popover" id="pop-model" style="left:150px"></div>
        <textarea id="input" rows="1" placeholder="Что сделать? Отдел разобьёт задачу и выполнит её прямо здесь…"></textarea>
        <div class="row">
          <button class="sel" title="Прикрепить файлы или репозиторий"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4L15.5 7"/></svg></button>
          <button class="sel" onclick="pop('mode')"><span id="modeLbl">Отдел</span> ▾</button>
          <button class="sel" onclick="pop('model')"><span id="modelLbl">Авто · сильнейшая</span> ▾</button>
          <button class="sel hide-sm" title="Репозиторий"><span class="k">⎇</span> octo/pomodoro</button>
          <button class="send" id="send" onclick="sendOrStop()" aria-label="Отправить"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — новая строка · агенты работают на вашем сервере</div>
